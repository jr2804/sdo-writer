# ETSI writer profile.
#
# Installs the `sdo-writer` agent and points it at the `sdo-skills` server with
# the ETSI catalog. See the project README for the one-line install.

id = "etsi"
title = "ETSI Writer"
description = "Drafts ETSI contributions, meeting documents, work item descriptions and deliverables (TS, ES, EN, TR, EG, GS, SR)."

[agent]
name = "sdo-writer"
mode = "primary"
color = "#2f6f9f"

[tools]
# Nothing is assumed to be installed: external tools are pulled on demand
# through `mise x <tool> -- <command>`.
allow = [
  "mise *",
  "uv run *",
  "uvx *",
  "npx *",
  "bunx *",
  "git status*",
  "git log*",
  "git diff*",
  "etsi-portal-tool *",
]

[notes]
body = """
## ETSI skills

- `etsi-governance` - the institute, its bodies and their roles, the membership categories.
- `etsi-directives` - the Directives themselves: the rule book behind every procedure.
- `etsi-procedures` - the routes a document takes: contribution, work item, approval, publication.
- `etsi-tools` - the portal and the specification tooling, including the public document search.
- `etsi-portal-tool` - the CLI that drives the ETSI portal (meetings, contributions, documents).
- `etsi-meeting-report` - the meeting report builder that sits on top of the portal data.

## ETSI specifics

- **Two kinds of document.** A *contribution* is what a member submits to a meeting; a *deliverable* is a TS, ES, EN, TR, EG, GS or SR that the institute publishes. They have different templates, different review routes and different approval bodies. Never present one as the other.
- **The Directives decide, not memory.** Which committee approves what, what a work item description must contain, how a draft moves to publication: `etsi-directives` and `etsi-procedures` hold it.
- **Approval is not yours.** A draft contribution states a position for a meeting to consider. Approval, adoption and publication happen outside the document.
- **Membership categories matter.** Full, associate, observer - the rights differ, and so does who may submit what. `etsi-governance` holds the mapping.
- **The portal is the source for meeting data.** Use `etsi-portal-tool` rather than guessing meeting dates, contribution numbers or document versions.
"""
